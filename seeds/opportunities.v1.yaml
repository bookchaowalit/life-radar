- slug: au-work-and-holiday-462-th
  name: Australia Work and Holiday visa (subclass 462) - Thailand
  name_th: โครงการตรวจลงตราทำงานและท่องเที่ยวไทย-ออสเตรเลีย (Work and Holiday Visa)
  description: Lets Thai passport holders aged 18-30 holiday and do short-term work in Australia for 12 months,
    with the option of a second (and third) year after specified regional work. Thailand has an annual country cap
    and needs a Thai government letter of support, so the age-31 cut-off and cap timing matter.
  category: abroad/working-holiday
  country: AU
  region: Asia-Pacific
  issuer: 'Australian Department of Home Affairs (letter of support: Thai Department of Children and Youth, MSDHS)'
  official_url: https://immi.homeaffairs.gov.au/visas/getting-a-visa/visa-listing/work-holiday-462/first-work-holiday-462
  value_benefit: '12-month visa: work short-term, study up to 4 months, unlimited re-entry; 3 months of specified
    work makes you eligible for a second Work and Holiday visa'
  cost: Visa application charge (check Home Affairs Visa Pricing Estimator); plus funds of about AUD 5,000 and onward
    fare, possible health checks/police certificates/biometrics; English test fee
  nationalities:
  - TH
  thai_eligible: 'yes'
  min_age: 18
  max_age: 30
  age_basis: at_application
  gender: any
  min_education: bachelor
  education_text: 'Thailand row: ''You must have a tertiary qualification from a university, college or training
    centre.'' Acceptable: degrees, graduate certificate, diplomas. Not acceptable: Certificate I-IV, Senior Secondary
    Certificate of Education.'
  conditions_text: '''You must be 18 to 30 years old (inclusive) when you apply... You must apply for your visa
    before you turn 31 years old'' (deadline midnight AEST the day before 31st birthday). Must apply from outside
    Australia, no dependent children, not previously entered on a 462/417. Thailand is on the list requiring a letter
    of support from your government. At least Functional English (e.g. IELTS Academic/General average 4.5, test
    within 12 months). About AUD 5,000 funds. Thailand is not subject to the pre-application ballot (only China,
    India, Vietnam; Indonesia moving to ballot).'
  conditions:
    letter_of_support: Thai government (Department of Children and Youth)
    english: Functional English, e.g. IELTS 4.5 average, test within 12 months
    funds_aud: 5000
    ballot: false
    annual_cap_thailand: 2000
  recurrence: annual
  quota: 2,000 first Work and Holiday visas per program year (1 July-30 June) for Thailand; status 'Open' on Home
    Affairs caps page
  attempts_limit: 1
  prep_lead_time_months: 4
  prerequisites:
  - Thai passport
  - tertiary qualification (degree/diploma/graduate certificate)
  - Functional English (IELTS 4.5 avg or equivalent, within 12 months)
  - Thai government letter of support (DCY)
  - ~AUD 5,000 funds
  urgency: time_critical
  source_url: https://immi.homeaffairs.gov.au/visas/getting-a-visa/visa-listing/work-holiday-462/first-work-holiday-462
  last_verified_at: '2026-10-17'
  verification_status: verified
  verification_notes: 'Verified on Home Affairs 462 page (age 18-30 inclusive, apply before 31st birthday; Thailand
    education rule; Thailand requires letter of support; ballot only for CN/IN/VN) and Status of country caps page
    (Thailand: Open, cap 2,000). Functional English scores verified on Home Affairs Functional English page (IELTS
    4.5). Not verified: Thai-side DCY letter-of-support application dates/selection method for 2026-27 (dcy.go.th
    is a JS app that could not be read; a non-official IDP article mentions a first round on 8 June 2026), and the
    exact current visa charge.'
  tags:
  - age-gated
  - working-holiday
  - once-in-lifetime
  - under-31
  - country-cap
  - government-letter-required
